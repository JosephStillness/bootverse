services:
  storage:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    command: /data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set local storage credentials}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set local storage credentials}
    volumes:
      - bootverse-images:/data
volumes:
  bootverse-images:
