name: Quality gates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bootverse_ci
          POSTGRES_DB: bootverse_ci
          # Disposable runner-only DB, reachable only through the loopback host port.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U bootverse_ci -d bootverse_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bootverse_ci@127.0.0.1:5432/bootverse_ci
      DATABASE_URL_UNPOOLED: postgresql://bootverse_ci@127.0.0.1:5432/bootverse_ci
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx --no-install prisma validate
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:integration
      # Private S3/browser acceptance is an additional release gate; see the runbook.
      - run: npm audit --omit=dev --audit-level=high
  full-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      # Deliberately remains failing while the known upstream lint advisory is unresolved.
      - run: npm audit --audit-level=high

  staging-image-check:
    # Build-only: no registry login/push, AWS credentials, migration or deploy step.
    # The full audit remains a hard gate; known advisories are not suppressed.
    if: github.event_name == 'workflow_dispatch'
    needs: [application, full-dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate staging Compose with placeholders
        run: >-
          STAGING_ENV_FILE=./staging.env.example
          BOOTVERSE_IMAGE=bootverse:ci-check
          docker compose -f deploy/compose.staging.yaml config --quiet
      - name: Build candidate image without secrets
        run: docker build --tag bootverse:ci-check .
